# Parametros del controlador Pure Pursuit
pure_pursuit:
  ros__parameters:
    use_sim_time: true
    # Trayectoria: figure8 | oval | custom
    path_type: figure8
    figure8_a: 3.5          # semieje en x [m]  -> la figura mide 7 m x 3 m (R_curva_min ~ 1 m > R_giro_robot = 0.41 m)
    figure8_b: 1.5          # amplitud en y [m]
    oval_straight: 3.0      # [m]
    oval_radius: 1.2        # [m]
    # Solo para path_type: custom (lista de waypoints en metros)
    waypoints_x: [0.0, 2.0, 4.0, 4.0, 2.0, 0.0]
    waypoints_y: [0.0, 0.0, 1.0, 3.0, 3.0, 2.0]
    closed_path: true
    align_to_start: true
    path_resolution: 0.05   # [m]
    laps: 1

    # Control
    linear_speed: 0.5       # v [m/s]
    lookahead_distance: 0.6 # Ld [m]
    lookahead_gain: 0.0     # Ld = Ld0 + k v
    control_rate: 30.0      # [Hz]
    start_delay: 2.0        # [s]
    goal_tolerance: 0.10    # [m]
    odom_topic: /odom

    # Parametros del robot (tabla de B)
    wheel_base: 0.1339      # L [m]
    max_steering_angle: 0.3142  # 18 deg [rad]

data_logger:
  ros__parameters:
    use_sim_time: true
    rate: 20.0
    shutdown_on_done: true
